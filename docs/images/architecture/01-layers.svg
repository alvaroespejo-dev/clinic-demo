<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-labelledby="t d">
  <title id="t">Solution layers and dependency direction</title>
  <desc id="d">Client calls the API over REST with JWT. API depends on Infrastructure and Master. Infrastructure depends on Application, Master and Domain. Application and Master depend on Domain.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #1c2b4a; }
      .card { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; }
      .teal { fill: #0f766e; stroke: #0f766e; }
      .soft { fill: #e6f2f0; stroke: #b7d9d4; stroke-width: 1.5; }
      .dash { fill: #f4f6fb; stroke: #9aa7bd; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #5c6b86; }
      .w { fill: #ffffff; }
      .ws { font-size: 13px; fill: #d7efeb; }
      .arrow { stroke: #1c2b4a; stroke-width: 2; fill: none; marker-end: url(#a); }
      .lbl { font-size: 12px; fill: #0f766e; font-weight: 600; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b4a"/>
    </marker>
  </defs>
  <rect width="920" height="620" rx="18" fill="#fbfcff"/>

  <rect class="card" x="290" y="24" width="340" height="68" rx="14"/>
  <text class="h" x="460" y="52" text-anchor="middle">AEspejo.Clinic.Client</text>
  <text class="s" x="460" y="74" text-anchor="middle">React 19 · Vite · TanStack Query · PWA</text>

  <path class="arrow" d="M460 92 L460 142"/>
  <text class="lbl" x="472" y="122">REST + JWT</text>

  <rect class="teal" x="210" y="144" width="500" height="84" rx="14"/>
  <text class="h w" x="460" y="174" text-anchor="middle">AEspejo.Clinic.API</text>
  <text class="ws" x="460" y="196" text-anchor="middle">Controllers · TenantResolutionMiddleware · JWT auth · DI composition</text>
  <text class="ws" x="460" y="214" text-anchor="middle">Background reminders · Webhooks · DevSeeder</text>

  <path class="arrow" d="M330 228 L230 288"/>
  <path class="arrow" d="M590 228 L690 288"/>

  <rect class="soft" x="40" y="290" width="340" height="104" rx="14"/>
  <text class="h" x="210" y="320" text-anchor="middle">AEspejo.Clinic.Infrastructure</text>
  <text class="s" x="210" y="342" text-anchor="middle">EF Core · repositories · AuditInterceptor</text>
  <text class="s" x="210" y="360" text-anchor="middle">tenancy · payments · notifications · PDF</text>
  <text class="s" x="210" y="378" text-anchor="middle">DB provider abstraction</text>

  <rect class="dash" x="400" y="316" width="120" height="52" rx="12"/>
  <text class="s" x="460" y="338" text-anchor="middle" style="font-weight:600;fill:#1c2b4a">Migrations</text>
  <text class="s" x="460" y="356" text-anchor="middle">PostgreSql</text>
  <path class="arrow" d="M400 342 L382 342"/>

  <rect class="soft" x="540" y="290" width="340" height="104" rx="14"/>
  <text class="h" x="710" y="320" text-anchor="middle">AEspejo.Clinic.Master</text>
  <text class="s" x="710" y="342" text-anchor="middle">MasterDbContext</text>
  <text class="s" x="710" y="360" text-anchor="middle">tenants · languages · countries</text>
  <text class="s" x="710" y="378" text-anchor="middle">platform operators · platform audit</text>

  <path class="arrow" d="M210 394 L210 448"/>
  <rect class="card" x="40" y="450" width="340" height="68" rx="14"/>
  <text class="h" x="210" y="478" text-anchor="middle">AEspejo.Clinic.Application</text>
  <text class="s" x="210" y="500" text-anchor="middle">services · DTOs · validators · Result&lt;T&gt;</text>

  <path class="arrow" d="M210 518 L210 552"/>
  <path class="arrow" d="M710 394 L710 552"/>
  <rect class="card" x="40" y="554" width="840" height="48" rx="14"/>
  <text class="h" x="460" y="584" text-anchor="middle">AEspejo.Clinic.Domain — entities · enums · no dependencies</text>

  <text class="s" x="410" y="440" style="font-size:12px">Infrastructure also references Master;</text>
  <text class="s" x="410" y="458" style="font-size:12px">the API also references Application.</text>
  <text class="s" x="410" y="484" style="font-size:12px">Arrows point toward the dependency.</text>
</svg>
